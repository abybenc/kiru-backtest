<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiru Backtest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Kiru Backtest <span id="asof" class="muted"></span></div>
  <button id="refresh" class="icon" title="Refresh data">⟳</button>
</header>
<div id="status" class="status hidden"></div>
<main>
  <section id="tab-today" class="tab active"></section>
  <section id="tab-a" class="tab"></section>
  <section id="tab-b" class="tab"></section>
  <section id="tab-paper" class="tab"></section>
  <section id="tab-review" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>
<nav>
  <button data-tab="today" class="on"><span>◉</span>Today</button>
  <button data-tab="a"><span>⇄</span>Nifty/Gold</button>
  <button data-tab="b"><span>▲</span>Momentum</button>
  <button data-tab="paper"><span>₹</span>Paper</button>
  <button data-tab="review"><span>✦</span>Review</button>
  <button data-tab="settings"><span>⚙</span>Settings</button>
</nav>
<script src="chart.umd.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
