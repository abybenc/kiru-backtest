name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Bundle Chart.js offline
        run: |
          npm pack chart.js@4.4.4 --silent
          tar xzf chart.js-4.4.4.tgz
          cp package/dist/chart.umd.js app/src/main/assets/chart.umd.js
      - name: Restore signing key
        run: base64 -d keystore.b64 > release.jks
      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KiruBacktest-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: 'KiruBacktest-*.apk' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kiru Backtest v1.0.${{ github.run_number }}
          files: 'KiruBacktest-*.apk'
